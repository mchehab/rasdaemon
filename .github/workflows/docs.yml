name: Github RAS Daemon pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  Deploy:
    name: Sphinx
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3 \
                                  pkg-config libsqlite3-dev sqlite3 \
                                  python3-sqlalchemy libcmocka-dev \
                                  libtraceevent-dev libtraceevent1 libpci-dev

      - name: Install Sphinx and its HTML theme
        run: pip install sphinx furo

      - name: Build docs
        run: make

      - name: Run CMocka tests
        id: cmocka
        continue-on-error: true
        run: |
          set -o pipefail
          build/unittest -o tap | tee cmocka.tap

      - name: Run Python tests
        id: python
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tests/run.py -vvv | tee python-tests.log

      - name: Create test-count badges
        run: |
          mkdir -p build/html/test-badges
          cmocka_pass=$(grep -c '^ok ' cmocka.tap || true)
          cmocka_fail=$(grep -c '^not ok ' cmocka.tap || true)
          python_total=$(sed -n 's/^Ran \([0-9][0-9]*\) tests.*/\1/p' python-tests.log | tail -1)
          python_total=${python_total:-0}
          python_fail=$(grep -Ec ':[[:space:]]*(FAIL|ERROR)' python-tests.log || true)
          python_skip=$(grep -Ec ':[[:space:]]*SKIP' python-tests.log || true)
          python_pass=$((python_total - python_fail - python_skip))
          export cmocka_pass cmocka_fail python_pass python_fail
          python3 -c 'import html, os, pathlib
          for tool, result, value, color in (
              ("rasdaemon", "pass", os.environ["cmocka_pass"], "4c1"),
              ("rasdaemon", "fail", os.environ["cmocka_fail"], "e05d44"),
              ("ras-mc-ctl", "pass", os.environ["python_pass"], "4c1"),
              ("ras-mc-ctl", "fail", os.environ["python_fail"], "e05d44")):
              label = f"{tool} {result}"
              width = max(92, 8 * len(label) + 14)
              svg = f"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{width + 28}\" height=\"20\"><rect width=\"{width}\" height=\"20\" fill=\"#555\"/><rect x=\"{width}\" width=\"28\" height=\"20\" fill=\"#{color}\"/><text x=\"6\" y=\"14\" fill=\"#fff\" font-family=\"Verdana\" font-size=\"11\">{html.escape(label)}</text><text x=\"{width + 10}\" y=\"14\" fill=\"#fff\" font-family=\"Verdana\" font-size=\"11\">{value}</text></svg>"
              pathlib.Path(f"build/html/test-badges/{tool}-{result}.svg").write_text(svg)'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Propagate test failures
        if: steps.cmocka.outcome != 'success' || steps.python.outcome != 'success'
        run: exit 1
