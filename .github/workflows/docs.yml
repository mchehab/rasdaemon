name: Github RAS Daemon pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  Deploy:
    name: Sphinx
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3 \
                                  pkg-config libsqlite3-dev sqlite3 \
                                  python3-sqlalchemy python3-mysqldb \
                                  python3-psycopg2 libcmocka-dev \
                                  libmysqlclient-dev libpq-dev postgresql \
                                  postgresql-client libtraceevent-dev \
                                  libtraceevent1 libpci-dev

      - name: Install Sphinx and its HTML theme
        run: pip install sphinx furo

      - name: Build docs
        run: make

      - name: Provision database test services
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysqladmin ping --host=127.0.0.1 --user=root
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 << EOF
          CREATE USER rasdaemon WITH PASSWORD 'mypass';
          CREATE DATABASE rasdaemon_test OWNER rasdaemon;
          EOF
          mysql --host=127.0.0.1 --user=root << EOF
          CREATE USER 'rasdaemon'@'%' IDENTIFIED BY 'mypass';
          CREATE DATABASE rasdaemon_test;
          GRANT ALL PRIVILEGES ON rasdaemon_test.* TO 'rasdaemon'@'%';
          FLUSH PRIVILEGES;
          EOF

      - name: Configure PostgreSQL test access
        run: |
          hba_file="$(sudo -u postgres psql --tuples-only --no-align --command='SHOW hba_file')"
          sudo sed -i '1i local all rasdaemon trust' "$hba_file"
          sudo systemctl restart postgresql.service
          PGPASSWORD='mypass' psql -h /var/run/postgresql -U rasdaemon \
              -d rasdaemon_test --set ON_ERROR_STOP=1 \
              --command='CREATE SCHEMA rasdaemon AUTHORIZATION rasdaemon;'

      - name: Run CMocka tests
        id: cmocka
        continue-on-error: true
        env:
          RAS_MYSQL_HOST: ''
          RAS_MYSQL_PORT: '3306'
          RAS_MYSQL_USER: rasdaemon
          RAS_MYSQL_PASSWORD: mypass
          RAS_MYSQL_DATABASE: rasdaemon_test
          RAS_MYSQL_SOCKET: ''
          RAS_MYSQL_USE_SSL: 'false'
          RAS_MYSQL_CONNECT_TIMEOUT: '10'
          RAS_PG_HOST: ''
          RAS_PG_PORT: 5432
          RAS_PG_USER: rasdaemon
          RAS_PG_PASSWORD: mypass
          RAS_PG_SCHEMA: rasdaemon
          RAS_PG_DATABASE: rasdaemon_test
        run: |
          set -o pipefail
          build/unittest -o tap 2>&1 | tee cmocka.tap

      - name: Run Python tests
        id: python
        continue-on-error: true
        env:
          RAS_MYSQL_HOST: ''
          RAS_MYSQL_PORT: '3306'
          RAS_MYSQL_USER: rasdaemon
          RAS_MYSQL_PASSWORD: mypass
          RAS_MYSQL_DATABASE: rasdaemon_test
          RAS_MYSQL_SOCKET: ''
          RAS_MYSQL_USE_SSL: 'false'
          RAS_MYSQL_CONNECT_TIMEOUT: '10'
          RAS_PG_HOST: ''
          RAS_PG_PORT: 5432
          RAS_PG_USER: rasdaemon
          RAS_PG_PASSWORD: mypass
          RAS_PG_SCHEMA: rasdaemon
          RAS_PG_DATABASE: rasdaemon_test
        run: |
          set -o pipefail
          tests/run.py -vvv 2>&1 | tee python-tests.log

      - name: Create test-count badges
        run: |
          mkdir -p build/html/test-badges
          scripts/generate-test-report.py cmocka.tap python-tests.log \
              build/html/test-badges

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Propagate test failures
        if: steps.cmocka.outcome != 'success' || steps.python.outcome != 'success'
        run: exit 1
