name: Build test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  Ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64_64, aarch64, ppc64le]
        config: [disable-all=false, disable-all=true]
    steps:
    - uses: actions/checkout@v7

    - name: prepare
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential meson ninja-build pkg-config \
                                git libsqlite3-dev sqlite3 \
                                libtraceevent-dev libtraceevent1 libpci-dev
    - name: build
      run: |
        meson setup build --reconfigure -D${{ matrix.config }}
        make
        sudo make install

  Fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
    - name: prepare
      run: |
        dnf install -y git mock rpmdevtools meson gcc make \
                       libtraceevent-devel qemu-user-static
        rpmdev-setuptree

    - uses: actions/checkout@v7

    - name: build SRPM
      run: |
        meson setup build -Ddisable-all=true
        git config --global safe.directory "*"

        make srpm

    - name: build x86_64 package
      run: |
        mock -r fedora-44-x86_64 ./rasdaemon-*.src.rpm

# FIXME: we likely need matrix here to be able to build for arm64 and RiscV

#    - name: build aarch64 package
#      run: |
#        mock -r fedora-44-aarch64 ./rasdaemon-*.src.rpm

#    - name: build riscv64 package
#      run: |
#        mock -r fedora-44-riscv64 ./rasdaemon-*.src.rpm

  openEuler:
    name: OpenEuler LTS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]
    container:
      image: openeuler/openeuler:24.03-lts-sp3
      options: --privileged
    steps:
    - name: prepare
      run: |
        dnf install -y sudo meson ninja-build gettext-devel hwdata \
                       make gcc libtraceevent-devel sqlite-devel sqlite \
                       pciutils pciutils-devel findutils

    - uses: actions/checkout@v7

    - name: build
      run: |
        meson setup build --reconfigure -Ddisable-all=false
        make
        make install

  Check:
    name: Source code check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: checkpatch
      run: |
        ignore_regex=$(grep -Ev '^\s*#' .github/workflows/checkpatch_ignore.txt | tr '\n' '|')
        ignore_regex=${ignore_regex%|}

        output=$(./scripts/checkpatch.pl --terse --show-types --no-summary \
                 -f $(git ls-files | grep -E '\.[ch]$') | \
                 grep -Ev "$ignore_regex" || true); echo $output; \
        if [ -z "$output" ]; then exit 0; fi; exit 1
