name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  Ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64_64, aarch64, ppc64le]
        config: [disable-all=false, disable-all=true]
    steps:
      - uses: actions/checkout@v2
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build libsqlite3-dev sqlite3 libtraceevent-dev libtraceevent1 libpci-dev
      - name: build
        run: |
          meson build --reconfigure -D${{ matrix.config }}
          make
          sudo make install

  Fedora:
    name: Fedora
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64_64]
    container:
      image: fedora:rawhide
      options: --privileged
    steps:
      - uses: actions/checkout@v2
      - name: prepare
        run: |
          dnf install -y mock rpm-build rpmdevtools \
                         meson ninja-build make gcc libtraceevent-devel
          ln -sf fedora-rawhide-x86_64.cfg /etc/mock/default.cfg
          rpmdev-setuptree
      - name: build
        run: |
          meson build --reconfigure -Ddisable-all=false
          make mock

  openEuler:
    name: OpenEuler LTS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]
    container:
      image: openeuler/openeuler:24.03-lts-sp3
      options: --privileged
    steps:
      - uses: actions/checkout@v2
      - name: prepare
        run: |
          dnf install -y sudo meson ninja-build gettext-devel hwdata \
                         make gcc libtraceevent-devel sqlite-devel sqlite \
                         pciutils pciutils-devel
      - name: build
        run: |
          meson build --reconfigure -Ddisable-all=false
          make
          make install

  Check:
    name: Source code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: checkpatch
        run: |
            ignore_regex=$(grep -Ev '^\s*#' .github/workflows/checkpatch_ignore.txt | tr '\n' '|')
            ignore_regex=${ignore_regex%|}

            output=$(./scripts/checkpatch.pl --terse --show-types --no-summary \
                     -f $(git ls-files | grep -E '\.[ch]$') | \
                     grep -Ev "$ignore_regex" || true); echo $output; \
            if [ -z "$output" ]; then exit 0; fi; exit 1
